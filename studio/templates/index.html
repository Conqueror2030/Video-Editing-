<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Template</title>
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
    <script src="../../node_modules/@antv/g2/dist/g2.min.js"></script>
    <style>
        body, #stage {
            background: transparent !important;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            position: relative;
        }

        #stage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .spoken-text {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin-bottom: 80px;
            text-transform: uppercase;
            max-width: 80%;
            line-height: 1.2;
            opacity: 0; /* GSAP will handle */
        }

        .metric-container {
            width: 800px;
            height: 600px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5); /* Slight contrast against transparent bg */
            opacity: 0; /* GSAP will handle */
            display: none; /* Only show when needed */
        }

        /* Clean minimal tech product announcements styling */
        .layout-minimal .spoken-text {
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .layout-bold .spoken-text {
            font-weight: 900;
            letter-spacing: 0;
        }
    </style>
</head>
<body data-width="1080" data-height="1920">
    <div id="stage">
        <!-- DYNAMIC_CONTENT_PLACEHOLDER -->
    </div>
    <script src="./motion.js"></script>
</body>
</html>
